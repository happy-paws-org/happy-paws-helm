replicaCount: 2

image:
  repository: likhithabhogyam/api-gateway
  tag: v1.0.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

containerPort: 8000

strategy:
  maxUnavailable: 1
  maxSurge: 1

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

config:
  USER_SERVICE_URL: http://user-service:8001
  PET_SERVICE_URL: http://pet-service:8002
  APPOINTMENT_SERVICE_URL: http://appointment-service:8003
  ORDER_SERVICE_URL: http://order-service:8004
  NOTIFICATION_SERVICE_URL: http://notification-service:8005

probes:
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10

  liveness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 20