replicaCount: 1

image:
  repository: postgres
  tag: "15"
  pullPolicy: IfNotPresent

service:
  port: 5432

containerPort: 5432

storage:
  size: 5Gi
  storageClassName: nfs-storage

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

secret:
  POSTGRES_DB: happypaws_users
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres