frontend-web:
  replicaCount: 3

api-gateway:
  replicaCount: 3

user-service:
  replicaCount: 3

pet-service:
  replicaCount: 3

appointment-service:
  replicaCount: 3

order-service:
  replicaCount: 3

notification-service:
  replicaCount: 3

postgres:
  storage:
    size: 10Gi

mongodb:
  storage:
    size: 10Gi

kgateway:
  enabled: true

  namespace: prod

  gateway:
    name: happy-paws-gateway
    gatewayClassName: kgateway
    listenerName: http
    protocol: HTTP
    port: 80

  route:
    name: happy-paws-route
    hostnames:
      - happypaws.com
      - www.happypaws.com