postgres:
  enabled: true

mongodb:
  enabled: true

frontend-web:
  replicaCount: 2

api-gateway:
  replicaCount: 2

user-service:
  replicaCount: 2

pet-service:
  replicaCount: 2

appointment-service:
  replicaCount: 2

order-service:
  replicaCount: 2

notification-service:
  replicaCount: 2

kgateway:
  enabled: true

  namespace: dev

  gateway:
    name: happy-paws-gateway
    gatewayClassName: kgateway
    listenerName: http
    protocol: HTTP
    port: 80

  route:
    name: happy-paws-route
    hostnames: []

  services:
    apiGateway:
      name: api-gateway
      port: 8000

    frontend:
      name: frontend-web
      port: 80