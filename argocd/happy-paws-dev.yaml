apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: happy-paws-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/happy-paws-org/happy-paws-helm.git
    targetRevision: develop
    path: umbrella/happy-paws
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true